name: Build Sparkbound Alpha05 APK

on:
  workflow_dispatch:
  push:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Unpack Alpha05 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'Sparkbound_Godot_Alpha05_Source*.zip' | sort | head -n 1)"
          echo "Using $ZIP"
          test -n "$ZIP"
          rm -rf work
          mkdir -p work
          unzip -q "$ZIP" -d work
          test -f work/Sparkbound_Godot_Alpha05/project.godot

      - name: Patch Godot 4.7 strict typing and Android texture settings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base = Path("work/Sparkbound_Godot_Alpha05")
          replacements = {
              "scripts/Player.gd": [
                  ("var shadow_scale := clamp(", "var shadow_scale: float = clampf("),
                  ("var attack_phase := clamp(", "var attack_phase: float = clampf("),
                  ("var swing := -0.75 + attack_phase * 1.20 if attack_timer > 0.0 else -0.55", "var swing: float = -0.75 + attack_phase * 1.20 if attack_timer > 0.0 else -0.55"),
                  ("var angle := facing.angle() + swing", "var angle: float = facing.angle() + swing"),
              ],
              "scripts/World.gd": [
                  ("var q := clamp((p - a).dot(ab) / den, 0.0, 1.0)", "var q: float = clampf((p - a).dot(ab) / den, 0.0, 1.0)"),
              ],
              "scripts/DrawPad.gd": [
                  ("var x := max(m, s.x * .5 - total * .5)", "var x: float = maxf(m, s.x * .5 - total * .5)"),
                  ("var p := canvas.position + event.position", "var p: Vector2 = canvas.position + event.position"),
              ],
              "scripts/TouchUI.gd": [
                  ("var r:Rect2=button_rects[key];var c:=r.get_center();var rad:=min(r.size.x,r.size.y)*.46", "var r:Rect2=button_rects[key];var c:Vector2=r.get_center();var rad:float=minf(r.size.x,r.size.y)*.46"),
              ],
              "scripts/Backdrop.gd": [
                  ("var live_w := lerp(s.x * .84, s.x * .25, clamp(erase_amount, 0.0, 1.0))", "var live_w: float = lerpf(s.x * .84, s.x * .25, clampf(erase_amount, 0.0, 1.0))"),
              ],
          }

          for rel, reps in replacements.items():
              p = base / rel
              txt = p.read_text()
              for old, new in reps:
                  txt = txt.replace(old, new)
              p.write_text(txt)

          project = base / "project.godot"
          txt = project.read_text()
          if "[debug]" not in txt:
              txt = txt.replace("[display]\n", "[debug]\ngdscript/warnings/inference_on_variant=1\n\n[display]\n", 1)
          if "textures/vram_compression/import_etc2_astc=true" not in txt:
              txt = txt.replace("[rendering]\n", "[rendering]\ntextures/vram_compression/import_etc2_astc=true\n", 1)
          project.write_text(txt)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android requirements for Godot 4.7
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Static smoke checks
        working-directory: work/Sparkbound_Godot_Alpha05
        run: python3 SMOKE_CHECK.py

      - name: Create debug keystore
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=GB" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Export Android APK with Godot 4.7.2
        id: export
        uses: firebelley/godot-export@v8.0.0
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./work/Sparkbound_Godot_Alpha05
          presets_to_export: Android
          export_debug: true
          cache: true
          verbose: true

      - name: Show APK
        shell: bash
        run: |
          echo "Build directory: ${{ steps.export.outputs.build_directory }}"
          find "${{ steps.export.outputs.build_directory }}" -type f -name '*.apk' -ls

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Sparkbound-Alpha05-Android
          path: ${{ steps.export.outputs.build_directory }}/**/*.apk
          if-no-files-found: error
